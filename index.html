<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub do Ponto Focal | GECART / SEAD-GO</title>
<style>
:root{--g:#00685b;--b:#e0e6ed;--t:#203542}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--t);font:14px/1.5 'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hero{background:linear-gradient(110deg,#00685b,#00594f);color:white;padding:25px max(24px,calc((100vw - 1150px)/2)) 36px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;letter-spacing:.07em;color:#d3f9ed;font-weight:700}.adminBtn{background:#ffffff15;border:1px solid #90bfb4;border-radius:9px;color:white;padding:9px 13px}.hero h1{font-size:36px;margin:22px 0 0}.hero p{color:#dcf4eb;margin:0 0 22px}.search{padding:15px;border:none;border-radius:10px;width:min(100%,760px)}main{max-width:1220px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--b);border-radius:13px;padding:14px;display:flex;flex-direction:column;align-items:center;color:var(--t)}.stat b{font-size:25px}.stat.active{border-color:#008768;background:#effbf5}h2{font-size:20px}.heading{display:flex;align-items:center;justify-content:space-between}.muted,.value{color:#71808d;font-size:12px;overflow-wrap:anywhere}.tabs,.tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button,.tools button{border:1px solid var(--b);border-radius:20px;background:white;padding:8px 12px;font-size:12px}.tabs .active{background:#007f61;color:white}.tools button{border-radius:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--b);border-radius:12px;padding:17px;min-width:0}.cardtop{display:flex;gap:13px}.icon{background:#e3f5ee;color:#007c61;border-radius:11px;width:42px;height:42px;flex-shrink:0;display:grid;place-items:center;font-size:22px}.icon.email{background:#e8f0ff;color:#2563eb}.icon.sei{background:#fff3e0;color:#a46c12}.icon.modelo{background:#f3ebff;color:#7943c2}.card h3{font-size:14px;margin:0 0 5px}.value{margin:0}.note{background:#f6f2ff;padding:10px;font-size:12px;border-radius:8px;overflow-wrap:anywhere}.actions{display:flex;justify-content:flex-end;gap:7px;border-top:1px solid #edf1f5;margin-top:16px;padding-top:12px}.actions a,.actions button{font-size:12px;border:1px solid #b5dbce;border-radius:8px;color:#007456;background:#eef9f5;text-decoration:none;padding:8px 11px}.actions button.danger{color:#b32c37;background:white;border-color:#edd0d0}dialog{border:1px solid var(--b);border-radius:14px;padding:24px;width:min(500px,95vw)}dialog::backdrop{background:#17263099}dialog form{display:grid;gap:12px}dialog label{display:grid;gap:4px;font-weight:650;font-size:12px}dialog input,dialog textarea,dialog select{width:100%;padding:10px;border:1px solid var(--b);border-radius:7px}dialog menu{display:flex;gap:8px;justify-content:end;padding:0}dialog button{border:1px solid var(--b);border-radius:8px;padding:9px 15px;background:white}dialog button.primary{background:var(--g);color:white}footer{text-align:center;padding:26px;color:#7c8a98;font-size:12px}@media(max-width:660px){.hero h1{font-size:27px}main{padding:15px}.grid{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:9px 3px}.stat b{font-size:21px}}
</style></head><body>
<header class="hero"><div class="top"><span class="brand">▦ &nbsp; GECART | SEAD-GO</span><button id="adminBtn" class="adminBtn">♙ Área GECART</button></div><h1>Hub do Ponto Focal</h1><p>Tudo o que você precisa para gerenciar a Carta de Serviços, em um só lugar.</p><input id="search" class="search" placeholder="⌕  O que você está procurando?" aria-label="Pesquisar recursos"></header>
<main><div id="stats" class="stats"></div><div class="heading"><h2>Acessos rápidos</h2><span id="count" class="muted"></span></div><div id="tools" class="tools" hidden><button id="add">＋ Adicionar recurso</button><button id="newcat">＋ Nova categoria</button><button id="export">⬇ Baixar planilha</button><button id="logout">Sair</button></div><div id="tabs" class="tabs"></div><section id="cards" class="grid"></section></main>
<footer>GECART | SEAD-GO — Gerência de Gestão da Carta de Serviços</footer>
<dialog id="auth"><form id="authForm"><h2>Área GECART</h2><p id="authNote" class="muted"></p><label>E-mail do administrador<input id="emailLogin" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><menu><button type="button" onclick="auth.close()">Cancelar</button><button class="primary">Continuar</button></menu></form></dialog>
<dialog id="editor"><form id="editForm"><h2 id="editTitle">Adicionar recurso</h2><label>Descrição<input name="title" required></label><label>Categoria<select name="cat" id="catField"></select></label><label>Endereço / contato<input name="value" required></label><label>Observações<textarea name="note"></textarea></label><menu><button type="button" onclick="editor.close()">Cancelar</button><button class="primary">Salvar</button></menu></form></dialog>
<script>
const BASE='https://gcylucijkhscxspfulfi.supabase.co';
const PUB='sb_publishable_t27ru6kehFdUoQZWfdm52g_OlbD3Kzb';
const $=id=>document.getElementById(id);
let data=[],extra=[],admin=false,filter='all',editing=null,session=null;
let cats=[['link','Links'],['modelo','Links modelo'],['email','E-mails'],['sei','Processos SEI'],['telefone','Telefones']];
const label=c=>cats.find(x=>x[0]===c)?.[1]||c;
const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const el=(tag,klass,text)=>{let n=document.createElement(tag);n.className=klass||'';if(text!==undefined)n.textContent=text;return n};
function credentials(){return session?.access_token ? {'apikey':PUB,'Authorization':'Bearer '+session.access_token} : {'apikey':PUB}}
async function api(table,method='GET',body=null,query=''){
 let opts={method,headers:{...credentials(),'Content-Type':'application/json'}};
 if(body!==null)opts.body=JSON.stringify(body);
 if(method==='POST')opts.headers.Prefer='return=representation';
 const res=await fetch(BASE+'/rest/v1/'+table+(query?'?'+query:''),opts);
 let txt=await res.text(),v=txt?JSON.parse(txt):null;
 if(!res.ok)throw Error(v?.message||v?.error_description||('Erro HTTP '+res.status));
 return v;
}
async function load(){
 try{
  const [categories,resources]=await Promise.all([
   api('hub_categories','GET',null,'select=id,name,sort_order&order=sort_order.asc'),
   api('hub_resources','GET',null,'select=id,category_id,title,address,note,sort_order&order=sort_order.asc,created_at.asc')
  ]);
  cats=categories.map(x=>[x.id,x.name]);
  data=resources.map(x=>({id:x.id,cat:x.category_id,title:x.title,value:x.address,note:x.note||''}));
  render();$('count').title='Dados sincronizados com o Supabase';
 }catch(e){$('cards').textContent='Não foi possível carregar os recursos. '+e.message; $('count').textContent='Falha de conexão';}
}
function render(){
 const s=norm($('search').value),rows=data.filter(x=>(filter==='all'||x.cat===filter||(filter==='link'&&x.cat==='modelo'))&&norm([x.title,x.value,x.note,label(x.cat)].join(' ')).includes(s));
 $('stats').replaceChildren();for(let [id,name,symbol] of [['link','Links','↗'],['email','E-mails','✉'],['sei','SEI','▤'],['telefone','Telefones','☎']]){
 let n=data.filter(x=>x.cat===id||(id==='link'&&x.cat==='modelo')).length,b=el('button','stat '+(id===filter?'active':''));b.innerHTML='<span>'+symbol+'</span><b>'+n+'</b><small>'+name+'</small>';b.onclick=()=>{filter=id;render()};$('stats').append(b)}
 $('tabs').replaceChildren();for(let [id,name] of [['all','Todos'],...cats]){let n=data.filter(x=>id==='all'||x.cat===id||(id==='link'&&x.cat==='modelo')).length,b=el('button',filter===id?'active':'',name+' ('+n+')');b.onclick=()=>{filter=id;render()};$('tabs').append(b)}
 $('count').textContent=rows.length+' de '+data.length+' recursos';$('cards').replaceChildren();
 for(const item of rows){let card=el('article','card'),top=el('div','cardtop'),ico=el('span','icon '+item.cat,({link:'↗',modelo:'⧉',email:'✉',sei:'▤',telefone:'☎'})[item.cat]||'▦'),content=el('div','');content.style.minWidth='0';content.append(el('h3','',item.title),el('p','value',item.value));top.append(ico,content);card.append(top);if(item.note)card.append(el('p','note',item.note));let actions=el('div','actions'),url=null;if(item.cat==='link'||item.cat==='email'||item.cat==='telefone'){url=item.cat==='email'?'mailto:'+item.value:item.cat==='telefone'?'tel:'+item.value.replace(/\D/g,''):item.value}
 let main=el(url?'a':'button','',item.cat==='telefone'?'☎ Ligar':item.cat==='email'?'✉ Enviar e-mail':item.cat==='link'?'↗ Acessar':'⧉ Copiar');if(url){if(item.cat==='link'&&!/^https?:\/\//.test(url))url=null;else{main.href=url;if(item.cat==='link'){main.target='_blank';main.rel='noopener noreferrer'}}}if(!url)main.onclick=()=>copy(item.value);actions.append(main);
 let cp=el('button','','⧉');cp.title='Copiar';cp.onclick=()=>copy(item.value);actions.append(cp);
 if(admin){let edit=el('button','','✎');edit.title='Editar';edit.onclick=()=>openEdit(item);actions.append(edit);let del=el('button','danger','×');del.title='Excluir';del.onclick=async()=>{if(!confirm('Excluir '+item.title+'?'))return;try{await api('hub_resources','DELETE',null,'id=eq.'+encodeURIComponent(item.id));await load()}catch(e){alert('Não foi possível excluir: '+e.message)}};actions.append(del)}card.append(actions);$('cards').append(card)}
}
async function copy(v){try{await navigator.clipboard.writeText(v)}catch{prompt('Copie:',v)}}
$('search').oninput=render;
function openEdit(item){if(!admin)return;editing=item;$('editForm').reset();let select=$('catField');select.replaceChildren();for(let [k,v] of cats){let o=document.createElement('option');o.value=k;o.textContent=v;select.append(o)}if(item){$('editTitle').textContent='Editar recurso';$('editForm').elements.title.value=item.title;$('editForm').elements.cat.value=item.cat;$('editForm').elements.value.value=item.value;$('editForm').elements.note.value=item.note}else $('editTitle').textContent='Adicionar recurso';$('editor').showModal()}
$('editForm').onsubmit=async e=>{e.preventDefault();if(!admin)return;let f=new FormData(e.target),v={category_id:f.get('cat'),title:String(f.get('title')).trim(),address:String(f.get('value')).trim(),note:String(f.get('note')||'').trim()};try{if(editing)await api('hub_resources','PATCH',v,'id=eq.'+encodeURIComponent(editing.id));else await api('hub_resources','POST',v);$('editor').close();await load()}catch(err){alert('Não foi possível salvar: '+err.message)}};
$('adminBtn').onclick=()=>{if(admin){$('tools').scrollIntoView({behavior:'smooth'});return}$('authNote').textContent='Use a conta de administrador autorizada no Supabase. Não é a senha antiga do navegador.';$('password').value='';$('auth').showModal()};
$('authForm').onsubmit=async e=>{
 e.preventDefault();
 try {
  const email=$('emailLogin').value.trim(),password=$('password').value;
  const res=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const token=await res.json();if(!res.ok||!token.access_token)throw Error(token.error_description||token.msg||token.error||'Login inválido');
  session=token;
  const rows=await api('hub_admins','GET',null,'select=user_id&user_id=eq.'+encodeURIComponent(token.user.id));
  if(!rows.length){session=null;throw Error('Esta conta ainda não foi autorizada como administradora da GECART.')}
  admin=true;$('auth').close();$('tools').hidden=false;$('adminBtn').textContent='⚙ Área GECART';render();
 }catch(err){alert(err.message)}
};
$('logout').onclick=async()=>{if(session){try{await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:{...credentials()}})}catch{} }session=null;admin=false;$('tools').hidden=true;render()};
$('add').onclick=()=>openEdit(null);
$('newcat').onclick=async()=>{if(!admin)return;let name=prompt('Nome da nova categoria:');if(!name?.trim())return;try{await api('hub_categories','POST',{id:'cat_'+Date.now(),name:name.trim(),sort_order:100});await load()}catch(e){alert('Não foi possível criar a categoria: '+e.message)}};
$('export').onclick=()=>{if(!admin)return;let csv='\uFEFF'+[['Tipo','Descrição','Endereço','Observações'],...data.map(x=>[label(x.cat),x.title,x.value,x.note])].map(row=>row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='hub-gecart.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('cards').textContent='Carregando recursos...';load();
</script></body></html>
